name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Aparte del build: el build de Next puede pasar con errores de tipo
      # según la configuración, y no queremos enterarnos en producción
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    name: La imagen compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secretos:
    name: Sin secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ningún archivo de secretos ni compose local versionado
        run: |
          hits=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p8|p12)$|^docker-compose\.yml$' | grep -v '\.env\.example$' || true)
          if [ -n "$hits" ]; then
            echo "::error::archivos que no deben versionarse:"; echo "$hits"; exit 1
          fi
      - name: Ninguna credencial embebida
        run: |
          pat='AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{16,}|sk-[A-Za-z0-9]{32,}|gh[pousr]_[A-Za-z0-9]{36,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          hits=$(git ls-files -z | xargs -0 grep -InE "$pat" -- 2>/dev/null | grep -v '^.github/workflows/' || true)
          if [ -n "$hits" ]; then echo "::error::posible credencial:"; echo "$hits"; exit 1; fi
      - name: Ningún secreto detrás de NEXT_PUBLIC_
        run: |
          # NEXT_PUBLIC_ viaja al navegador. Un secreto con ese prefijo es un secreto público.
          hits=$(git ls-files -z | xargs -0 grep -InE 'NEXT_PUBLIC_[A-Z_]*(SECRET|PRIVATE|TOKEN|PASSWORD|_KEY)\b' -- 2>/dev/null | grep -v '^.github/workflows/' || true)
          if [ -n "$hits" ]; then
            echo "::error::variable con pinta de secreto expuesta al navegador:"; echo "$hits"; exit 1
          fi
          echo "Sin secretos expuestos al navegador"

  pr:
    name: PR completo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: La rama sigue el formato jb-##-slug
        run: |
          rama="${{ github.head_ref }}"
          echo "$rama" | grep -qE '^jb-[0-9]+-[a-z0-9-]+$' || {
            echo "::error::rama '$rama' no sigue el formato jb-##-slug"; exit 1; }
      - name: Las cuatro secciones del PR están completas
        env:
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          faltan=0
          for s in "Qué se hizo" "Cómo se resolvió" "Archivos tocados" "Migraciones"; do
            echo "$CUERPO" | grep -qF "$s" || { echo "::error::falta '$s'"; faltan=1; }
          done
          [ "$faltan" -eq 0 ]
